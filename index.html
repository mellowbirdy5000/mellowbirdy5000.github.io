<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Analytics Safe Test Form</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5W9JKQE37K"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-5W9JKQE37K', {
      'debug_mode': true
    });
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    .button-group {
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 15px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-submit {
      background-color: #007bff;
      color: white;
    }
    .btn-random {
      background-color: #6c757d;
      color: white;
    }
    #status {
      margin-top: 15px;
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>GA4 Non-PII Test Form</h2>
  
  <form id="testForm">
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>
    </div>

    <div class="form-group">
      <label for="phone">Phone:</label>
      <input type="text" id="phone" name="phone" required>
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
      <label for="description">Description:</label>
      <textarea id="description" name="description" rows="4" required></textarea>
    </div>

    <div class="button-group">
      <button type="submit" class="btn-submit">Submit Form</button>
      <button type="button" id="generateBtn" class="btn-random">Fill Dummy Data</button>
    </div>
  </form>

  <p id="status"></p>

  <script>
    // Generates mathematically obvious dummy identifiers that bypass PII detection
    function fillDummyData() {
      const randId = Math.floor(100000 + Math.random() * 900000);
      
      document.getElementById('name').value = `Test_User_${randId}`;
      document.getElementById('phone').value = `000-000-0000`;
      document.getElementById('email').value = `dummy_user_${randId}@example.com`; // example.com is RFC standard reserved dummy domain
      document.getElementById('description').value = `Synthetic event string for event verification batch #${randId}.`;
    }

    document.getElementById('generateBtn').addEventListener('click', fillDummyData);

    document.getElementById('testForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;
      const description = document.getElementById('description').value;

      gtag('event', 'form_submission', {
        'form_name': 'Synthetic Test Form',
        'test_user_name': name,
        'test_user_phone': phone,
        'test_user_email': email,
        'test_description': description,
        'debug_mode': true
      });

      document.getElementById('status').innerText = 'Synthetic event sent to G-5W9JKQE37K!';
      console.log('gtag payload fired:', { name, phone, email, description });
      
      this.reset();
    });
  </script>

</body>
</html>
