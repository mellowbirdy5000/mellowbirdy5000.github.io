<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Analytics Form Tracking Test</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5W9JKQE37K"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-5W9JKQE37K');
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 15px;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    #status {
      margin-top: 15px;
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Contact Form (GA4 Event Test)</h2>
  
  <form id="testForm">
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>
    </div>

    <div class="form-group">
      <label for="phone">Phone:</label>
      <input type="tel" id="phone" name="phone" required>
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
      <label for="description">Description:</label>
      <textarea id="description" name="description" rows="4" required></textarea>
    </div>

    <button type="submit">Submit Form</button>
  </form>

  <p id="status"></p>

  <script>
    document.getElementById('testForm').addEventListener('submit', function(e) {
      e.preventDefault(); // Stop default navigation for testing

      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;
      const description = document.getElementById('description').value;

      // Send event with your G-5W9JKQE37K measurement setup
      gtag('event', 'form_submission', {
        'form_name': 'Contact Form',
        'test_user_name': name,
        'test_user_phone': phone,
        'test_user_email': email,
        'test_description_length': description.length
      });

      document.getElementById('status').innerText = 'Event sent to G-5W9JKQE37K!';
      console.log('gtag event sent:', { name, phone, email, description });
      
      this.reset();
    });
  </script>

</body>
</html>
